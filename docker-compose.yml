# One command: docker compose up --build   ->  http://localhost:8080
# Tests:       docker compose --profile test run --rm tests

x-backend-env: &backend-env
  DATABASE_URL: postgresql://certiflow:certiflow@postgres:5432/certiflow
  REDIS_URL: redis://redis:6379
  WHATSAPP_URL: http://whatsapp:4100
  PUBLIC_BASE_URL: http://localhost:8080
  CERTIFICATE_DIR: /data/certificates
  JWT_SECRET: ${JWT_SECRET:-hisfdsy7w9er3w7r32923r-0001}
  DOWNLOAD_SECRET: ${DOWNLOAD_SECRET:-ijdfuesfwjeryw7r9230001}
  # Short SLA so the "stuck batch" escalation is visible in a demo.
  STAGE_SLA_MINUTES: ${STAGE_SLA_MINUTES:-30}
  SLA_SWEEP_INTERVAL_MS: 15000
  RECONCILE_INTERVAL_MS: 30000
  DEMO_MODE: "true"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: certiflow
      POSTGRES_PASSWORD: certiflow
      POSTGRES_DB: certiflow
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    ports: ["5433:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U certiflow"]
      interval: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    # AOF persistence: queued jobs survive a Redis restart. Even without it the
    # reconciler rebuilds queue state from Postgres (see README).
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes: [redisdata:/data]
    ports: ["6380:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 20

  whatsapp:
    build: { context: ./backend, target: runtime }
    command: ["node", "dist/src/mock-whatsapp/server.js"]
    environment:
      PORT: 4100
      WA_FAILURE_RATE: ${WA_FAILURE_RATE:-0.2}
      WA_TIMEOUT_RATE: ${WA_TIMEOUT_RATE:-0.1}
      WA_RATE_LIMIT_RATE: 0.05
      WA_HANG_MS: 8000
      WA_PERSIST_FILE: /data/whatsapp/messages.jsonl
    volumes: [whatsappdata:/data/whatsapp]
    user: root

  migrate:
    build: { context: ./backend, target: runtime }
    command: ["sh", "-c", "npx prisma migrate deploy && node dist/prisma/seed.js"]
    environment: *backend-env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  api:
    build: { context: ./backend, target: runtime }
    environment:
      <<: *backend-env
      SERVICE_NAME: api
    volumes: [certificates:/data/certificates]
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/api/health"]
      interval: 5s
      retries: 20

  worker:
    build: { context: ./backend, target: runtime }
    command: ["node", "dist/src/worker.js"]
    environment:
      <<: *backend-env
      SERVICE_NAME: worker
    volumes: [certificates:/data/certificates]
    depends_on:
      migrate: { condition: service_completed_successfully }
      whatsapp: { condition: service_started }
    # Two replicas from the start: proves workers coordinate correctly.
    deploy: { replicas: 2 }

  frontend:
    build: { context: ./frontend }
    ports: ["8080:80"]
    depends_on:
      api: { condition: service_healthy }

  tests:
    profiles: ["test"]
    build: { context: ./backend, target: test }
    environment:
      DATABASE_URL: postgresql://certiflow:certiflow@postgres:5432/certiflow_test
      REDIS_URL: redis://redis:6379/1
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

volumes:
  pgdata:
  redisdata:
  whatsappdata:
  certificates:
